<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pressBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0417"/>
      <stop offset="100%" stop-color="#24010a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grapeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="pressShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Burgundy Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#pressBg)" filter="url(#pressShadow)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Golden Ring -->
  <circle cx="64" cy="52" r="34" fill="#1f0209" stroke="url(#goldGrad)" stroke-width="3" filter="url(#pressShadow)"/>

  <!-- Champagne Grape Bunch & Leaves -->
  <!-- Leaves at top -->
  <path d="M64 30 C58 24 50 26 48 32 C54 34 60 32 64 34 Z" fill="#22c55e"/>
  <path d="M64 30 C70 24 78 26 80 32 C74 34 68 32 64 34 Z" fill="#16a34a"/>
  <!-- Stem -->
  <path d="M64 26 v6" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Grapes -->
  <g fill="url(#goldGrad)">
    <!-- Row 1 -->
    <circle cx="53" cy="40" r="5"/>
    <circle cx="64" cy="40" r="5"/>
    <circle cx="75" cy="40" r="5"/>
    <!-- Row 2 -->
    <circle cx="48" cy="48" r="5"/>
    <circle cx="58" cy="48" r="5"/>
    <circle cx="69" cy="48" r="5"/>
    <circle cx="79" cy="48" r="5"/>
    <!-- Row 3 -->
    <circle cx="53" cy="57" r="5"/>
    <circle cx="64" cy="57" r="5"/>
    <circle cx="75" cy="57" r="5"/>
    <!-- Row 4 -->
    <circle cx="58" cy="65" r="4.5"/>
    <circle cx="69" cy="65" r="4.5"/>
    <!-- Tip -->
    <circle cx="64" cy="72" r="4"/>
  </g>

  <!-- Golden Pressoir Ribbon Badge -->
  <rect x="18" y="94" width="92" height="20" rx="10" fill="url(#goldGrad)" filter="url(#pressShadow)"/>
  <text x="64" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#24010a" text-anchor="middle" letter-spacing="1.2">PRESSOIR 4000</text>
</svg>
